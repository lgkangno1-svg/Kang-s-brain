name: Korea Concierge CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/korea-avocadoss/**'
      - '.github/workflows/korea-concierge-ci.yml'
  pull_request:
    paths:
      - 'projects/korea-avocadoss/**'
      - '.github/workflows/korea-concierge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korea-concierge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: i18n and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/korea-avocadoss
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate P0 localization contracts
        run: npm run check:i18n

      - name: Build production application
        run: npm exec -- next build
