name: Korea Concierge CI (GitHub-hosted fallback)

# Primary automatic verification runs on the repository-scoped MiniPC runner
# from the private lgkangno1-svg/korea-concierge-ci control repository.
# Keep this workflow manual-only as a recovery/fallback path so the public
# repository cannot dispatch untrusted pull-request code onto the MiniPC and
# normal development does not consume GitHub-hosted Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korea-concierge-github-hosted-fallback
  cancel-in-progress: true

jobs:
  verify:
    name: i18n and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: projects/korea-avocadoss
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate npm lockfile policy
        run: node scripts/check-lockfile-policy.mjs

      - name: Install frozen dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate P0 localization contracts
        run: npm run check:i18n

      - name: Build production application
        run: npm exec -- next build

      - name: Verify generated document languages
        run: npm run check:document-lang

      - name: Verify deterministic legacy redirects
        shell: bash
        run: |
          set -euo pipefail
          port="$(node -e "const net=require('node:net'); const s=net.createServer(); s.listen(0,'127.0.0.1',()=>{console.log(s.address().port); s.close();});")"
          origin="http://127.0.0.1:${port}"
          npm exec -- next start --hostname 127.0.0.1 --port "$port" > /tmp/korea-concierge-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          REDIRECT_CHECK_ORIGIN="$origin" npm run check:legacy-redirects
